name: Build patched Windows release

on:
  pull_request:
  push:
    branches: [main, fix/detail-timeout-partial-comments]
    paths:
      - "patched/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Checkout upstream v2.5.0
        uses: actions/checkout@v4
        with:
          repository: xpzouying/xiaohongshu-mcp
          ref: 6583124dfda92312b6bc19a042a6acfae63fe498
          path: upstream

      - name: Apply patched implementation
        run: |
          cp -r patched/. upstream/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: upstream/go.sum

      - name: Test
        working-directory: upstream
        run: go test ./...

      - name: Build Windows amd64
        working-directory: upstream
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=v2.5.0-patched-detail.1" -o ../xiaohongshu-mcp-windows-amd64-patched.exe .
          cd ..
          sha256sum xiaohongshu-mcp-windows-amd64-patched.exe > xiaohongshu-mcp-windows-amd64-patched.exe.sha256

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: xhs-windows-${{ github.sha }}
          path: |
            xiaohongshu-mcp-windows-amd64-patched.exe
            xiaohongshu-mcp-windows-amd64-patched.exe.sha256

      - name: Publish fixed release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0-patched-detail.1
          name: v2.5.0 bounded detail and partial comments
          body: |
            Based on xpzouying/xiaohongshu-mcp v2.5.0.
            Includes search hydration waiting, bounded navigation retry, and shared browser reuse.
            Bounds detail comment loading and returns saved snapshots with an explicit warning on interruption.
          files: |
            xiaohongshu-mcp-windows-amd64-patched.exe
            xiaohongshu-mcp-windows-amd64-patched.exe.sha256
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
